<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TasksSimplified</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <div class="logo">
        <img src="./assets/logo.png" alt="TasksSimplified Logo" />
        TasksSimplified
      </div>
      <div class="search-container">
        <input
          type="text"
          class="search-input"
          placeholder="Search your task here..."
        />
        <button class="search-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
        </button>
      </div>
      <div class="data-display">
        <div class="day" id="currentDay">Tuesday</div>
        <div class="full-date" id="currentDate">11/10/2025</div>
      </div>
    </header>
    <div class="container">
      <!-- Sidebar with profile -->
      <div class="sidebar">
        <div class="profile">
          <div class="profile-img">
            <img src="/assets/profile.jpg" alt="Profile">
          </div>
          <div class="profile-name">Bella Whiskers</div>
          <div class="profile-email">bella@meow.com</div>
        </div>
        <button class="sidebar-button">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            style="margin-right: 10px"
          >
          <path
              d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
            ></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          My Tasks
        </button>

        <!-- Sidebar content -->
      </div>

      <!-- Main content area -->
      <div class="main-content">
        <!-- Task list column -->
        <div class="tasks-column">
          <div class="column-head-container">
            <h2 class="column-header">My Tasks</h2>
          </div>
          <!-- Task column content -->
        </div>

        <!-- Task details panel -->
        <div class="task-details">
          <!-- Task details content -->
        </div>
      </div>
    </div>
  </body>
</html>
